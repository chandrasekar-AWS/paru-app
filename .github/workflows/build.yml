name: Build Paru
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bundle Python (so Windows users need nothing installed)
        shell: pwsh
        run: ./scripts/bundle-python-win.ps1
        continue-on-error: true          # if this fails the app still works when Python is installed on the PC
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with: { name: Paru-Windows, path: dist/*.exe }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with: { name: Paru-Linux-AppImage, path: dist/*.AppImage }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node prepare-web.js
          npx cap add android
          node patch-android.js
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: Paru-Android-APK, path: mobile/android/app/build/outputs/apk/debug/*.apk }
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r agent/requirements.txt pytest
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd test && python -m pytest -q test_wake.py test_custom_wake.py
      - run: node --test test/auth.test.js
