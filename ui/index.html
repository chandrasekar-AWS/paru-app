<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="paru-token" content="__PARU_TOKEN__">
<title>Paru</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="lights" id="lights">
      <button class="light red" id="win-close" aria-label="Hide to tray"></button>
      <button class="light yellow" id="win-min" aria-label="Minimize"></button>
      <button class="light green" id="win-max" aria-label="Maximize"></button>
    </div>
    <button class="icon-btn" id="toggle-side" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <div class="title">Paru</div>
    <button class="icon-btn" id="toggle-theme" aria-label="Switch light or dark theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <!-- first-run flow -->
  <main id="onboarding" hidden></main>

  <!-- main app -->
  <div id="shell" hidden>
    <aside id="sidebar">
      <nav>
        <button class="nav" data-view="chat" id="nav-new"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>New chat</span></button>
        <button class="nav" data-view="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
        <button class="nav" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Settings</span></button>
      </nav>
      <div class="side-foot">
        <div class="agent-state"><i id="agent-dot"></i><span id="agent-label">Agent offline</span></div>
        <button id="talk" class="talk">Talk</button>
      </div>
    </aside>
    <section id="content">
      <div id="banner" hidden>
        <i class="dot"></i>
        <div class="banner-text"><b id="banner-title"></b><span id="banner-msg"></span></div>
        <label class="switch-row"><span id="banner-state">Off</span><span class="switch"><input type="checkbox" id="listen-toggle"><i></i></span></label>
      </div>
      <div id="view-chat" class="view"></div>
      <div id="view-history" class="view" hidden></div>
      <div id="view-settings" class="view" hidden></div>
    </section>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
