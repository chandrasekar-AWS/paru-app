<style>

#card{background:linear-gradient(180deg,#171332,#110e26);border:1px solid var(--line);border-radius:20px;padding:26px 26px 22px;box-shadow:0 20px 60px #0008}

body.phone #wrap{padding-top:calc(14px + env(safe-area-inset-top))}

<body><div id="tb">Paru</div>
<div id="wrap"><div id="orbBox"><div class="paru-orb" id="orb"></div></div><div id="dots"></div><div id="card"></div></div>
<script src="voices.js"></script><script src="orb.js"></script><script src="engine.js"></script>
<script>

function dots() { const d = $('dots'); d.innerHTML = ''; const list = ONLY ? [STEPS[cur]] : STEPS; list.forEach(([id, n]) => { const i = el('i', { text: n }); const k = STEPS.findIndex(s => s[0] === id); i.className = k === cur ? 'on' : k < cur ? 'done' : ''; d.append(i); }); }

const leave = () => P.setupBack ? P.setupBack() : location.replace('index.html');

/* ---------- agent is the engine for hearing and checking keys: wait until it answers ---------- */
async function agentReady(box) {

    const h = await P.api('/health');
    if (h && h.ok) return h;

    if (a && (a.state === 'nopython' || a.state === 'error') && box) { box.className = 'msg bad'; }
    await sleep(1000);
  }
}

const RENDER = {};
/* =============================== 1. account =============================== */
RENDER.account = async function () {
  const A = await P.authState();
  if (A.signedIn && !ONLY) { if (C.onboarded) return leave(); return go(P.isElectron ? 'voice' : 'connect'); }
  if (!A.configured) return renderDevSetup(A);

    card.innerHTML = ''; card.append(el('h1', { text: 'Welcome to Paru' }), el('p', { class: 'sub', text: 'Sign in to start. Your chats, keys and voice stay on this device.' }));
    if (P.authGoogle) card.append(el('button', { class: 'btn w gbtn', id: 'g', onclick: google }, el('span', { text: 'G', style: 'font-weight:800;color:#4285f4' }), 'Continue with Google'), el('div', { class: 'sep', text: 'or use email' }));
    card.append(el('label', { text: 'Email' }), el('input', { id: 'em', type: 'email', placeholder: 'you@gmail.com', autocomplete: 'email' }), el('label', { text: 'Password' }), el('input', { id: 'pw', type: 'password', placeholder: mode === 'up' ? 'At least 6 characters' : 'Your password', autocomplete: mode === 'up' ? 'new-password' : 'current-password' }),
      el('div', { class: 'row', style: 'margin-top:16px' }, el('button', { class: 'btn', id: 'go', onclick: submit, text: mode === 'up' ? 'Create account' : 'Sign in' }), el('button', { class: 'btn g', onclick: () => { mode = mode === 'up' ? 'in' : 'up'; draw(); }, text: mode === 'up' ? 'I have an account' : 'Create an account' })),
      el('p', { class: 'msg', id: 'm' }), el('p', { class: 'note', text: 'Only your sign-in goes to the internet (to Supabase). Nothing else leaves this device except what you ask the AI.' }));

  async function submit() { const e = $('em').value.trim(), p = $('pw').value; msg('m', mode === 'up' ? 'Creating your account\u2026' : 'Signing in\u2026', 'wait'); $('go').disabled = true; done(await (mode === 'up' ? P.authSignUp(e, p) : P.authSignIn(e, p))); }

  draw();
};
function renderDevSetup(A) {                                          // the app owner pastes their Supabase project once
  card.append(el('h1', { text: 'Connect sign-in' }), el('p', { class: 'sub', text: 'Paru uses Supabase for sign-in. Create a free project at supabase.com, then paste its two values here (once).' }),
    el('label', { text: 'Project URL' }), el('input', { id: 'su', placeholder: 'https://abcdxyz.supabase.co' }), el('label', { text: 'anon public key (Project Settings \u2192 API)' }), el('input', { id: 'sk', placeholder: 'eyJhbGciOi\u2026' }),
    el('div', { class: 'row', style: 'margin-top:16px' }, el('button', { class: 'btn', text: 'Save', onclick: async () => { const r = await P.authSetConfig($('su').value, $('sk').value); if (r.ok) return go('account'); msg('m', r.error, 'bad'); } })), el('p', { class: 'msg', id: 'm' }),
    el('p', { class: 'note' }, 'In Supabase turn on Google under Authentication \u2192 Providers, and add this under Authentication \u2192 URL Configuration \u2192 Redirect URLs: ', el('code', { text: (A && A.redirect) || 'http://127.0.0.1:53682/callback' })));
}

/* =============================== 1b. phone: connect to the computer that runs Paru =============================== */
RENDER.connect = async function () {

    el('label', { text: 'Address' }), el('input', { id: 'srv', value: C.server || '', placeholder: 'http://192.168.1.20:8000', autocapitalize: 'off', autocomplete: 'off' }), el('label', { text: 'Key (VOICE_KEY)' }), el('input', { id: 'vk', value: C.key || '', placeholder: 'the key shown on your computer', autocapitalize: 'off', autocomplete: 'off' }),

/* =============================== 2. voice =============================== */
RENDER.voice = async function () {
  card.append(el('h1', { text: 'Let\u2019s get to know your voice' }), el('p', { class: 'sub', text: 'Paru speaks a short phrase, you say it back, and Paru shows what it heard. This teaches it your voice and microphone.' }), el('div', { id: 'vb' }));

    $('vs').innerHTML = ''; $('vs').append(el('div', { class: 'prompt', text: 'Your voice is saved \u2713' }), el('label', { style: 'display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px;color:var(--tx)' }, el('input', { type: 'checkbox', style: 'width:auto', id: 'vlock', onchange: e => P.setCfg({ voiceLock: e.target.checked }) }), 'Only wake up for my voice (you can change this later)'));
    msg('m', ''); vb.append(el('div', { class: 'row', style: 'margin-top:16px' }, el('button', { class: 'btn', text: 'Continue', onclick: next })));
  }
};

/* =============================== 3. AI key =============================== */
const guess = k => /^sk-ant-/.test(k) ? 'anthropic' : /^sk-or-/.test(k) ? 'openrouter' : /^gsk_/.test(k) ? 'groq' : /^xai-/.test(k) ? 'xai' : /^AIza/.test(k) ? 'gemini' : /^sk-/.test(k) ? 'openai' : '';
RENDER.key = async function () {
  card.append(el('h1', { text: 'Add your AI key' }), el('p', { class: 'sub', text: 'Use the AI you prefer: Gemini, ChatGPT, Claude, or any other. Paste your own key; Paru checks that it is real.' }), el('p', { class: 'msg wait', id: 'ready', text: 'Starting Paru\u2019s engine\u2026' }));

  const grid = el('div', { class: 'provs' }); card.append(grid);
  const kb = el('div'); card.append(kb);

    grid.innerHTML = ''; list.forEach(p => grid.append(el('button', { class: 'prov' + (p.id === sel ? ' on' : ''), text: p.name, onclick: () => { sel = p.id; verified = null; draw(); } })));
    const p = list.find(x => x.id === sel) || {}; kb.innerHTML = '';
    kb.append(el('label', {}, p.keyless ? 'Key (not needed for this one)' : p.id === 'custom' ? 'Your key' : 'Your ' + p.name.replace(/\s*\(.*\)/, '') + ' key', p.link ? el('span', {}, ' \u2014 ', el('a', { href: p.link, target: '_blank', text: 'get a key' })) : ''),
      el('input', { id: 'k', type: 'password', placeholder: st.hasKey && st.id === sel ? '\u2022\u2022\u2022\u2022\u2022\u2022 (a key is saved; paste a new one to replace it)' : 'Paste it here', autocomplete: 'off', spellcheck: 'false' }));
    if (sel === 'custom' || p.keyless) kb.append(el('label', { text: 'Address' }), el('input', { id: 'b', value: (st.id === sel && st.base) || p.base || '', placeholder: 'https://my-server/v1' }));
    kb.append(el('label', { text: 'Model (leave on automatic unless you know you need one)' }), el('select', { id: 'mo' }, el('option', { value: '', text: 'Automatic (recommended)' })),
      el('div', { class: 'row', style: 'margin-top:16px' }, el('button', { class: 'btn', id: 'vf', text: 'Check key', onclick: check }), el('button', { class: 'btn g hide', id: 'sv', text: 'Save and continue', onclick: save })), el('p', { class: 'msg', id: 'm' }),

      el('p', { class: 'note', text: 'Your key is stored encrypted on this computer and sent only to ' + (p.name || 'your provider') + '.' }));
    $('k').oninput = () => { const g = guess($('k').value.trim()); if (g && g !== sel && !(sel === 'custom' || ['openai', 'deepseek', 'together', 'mistral'].includes(sel) && g === 'openai')) { sel = g; const v = $('k').value; draw(); $('k').value = v; $('k').focus(); msg('m', 'That looks like a ' + (list.find(x => x.id === g) || {}).name + ' key.', 'wait'); } verified = null; $('sv').classList.add('hide'); };
  };

    msg('m', 'Checking with ' + (list.find(x => x.id === sel) || {}).name + '\u2026', 'wait'); $('vf').disabled = true; const r = await api('/voice/provider/verify', b); $('vf').disabled = false;
    if (r.error && !r.ok && !r.network) return msg('m', r.error, 'bad');
    if (!r.ok) { msg('m', r.error + ' You can still save it and try later.', 'bad'); $('sv').classList.remove('hide'); verified = false; return; }
    verified = r; msg('m', 'Key is valid \u2713' + (r.model ? ' \u00b7 using ' + r.model : '') + (r.note ? ' \u00b7 ' + r.note : ''), 'ok');
