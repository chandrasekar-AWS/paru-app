<!doctype html>
<html><head><meta charset="utf-8"><meta name="paru-token" content="__PARU_TOKEN__">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  #orb{position:absolute;inset:0;margin:auto;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.72);
       transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;user-select:none}
  body.on #orb{opacity:1;transform:scale(1)}
  body.think #orb{filter:saturate(1.35) brightness(1.15)}
  @media (prefers-reduced-motion:reduce){#orb{transition:opacity .2s}}
</style></head>
<body><img id="orb" src="/assets/orb.webp" alt="" draggable="false">
<script>
const token=document.querySelector('meta[name=paru-token]').content;
let ws,retry=0;
function show(v){document.body.classList.toggle('on',v); if(window.paruOrb) window.paruOrb.visible(v);}
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws?token=${token}`);
  ws.onmessage=e=>{const d=JSON.parse(e.data);
    if(d.type==='orb') show(!!d.visible);
    else if(d.type==='thinking') document.body.classList.toggle('think',!!d.on);
    else if(d.type==='settings'&&window.paruOrb) window.paruOrb.size(d.settings.orb_size, d.settings.orb_enabled);};
  ws.onopen=()=>{retry=0;fetch('/api/settings',{headers:{'x-paru-token':token}}).then(r=>r.json()).then(s=>window.paruOrb&&window.paruOrb.size(s.orb_size,s.orb_enabled));};
  ws.onclose=()=>setTimeout(connect,Math.min(5000,500*++retry));
}
connect();
</script></body></html>
