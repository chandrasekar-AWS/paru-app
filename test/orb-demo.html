<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ui/orb.css">
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}#s{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.paru-orb{margin:0;--osz:300px}</style></head>
<body><div id="s"><div class="paru-orb" id="o"></div></div><script src="../ui/orb.js"></script>
<script>const orb=ParuOrb.mount(document.getElementById('o'),document.createElement('div'));window.orb=orb;
// fake voice: a talking-like envelope
let t0=performance.now();window.talk=on=>{window._talk=on};
setInterval(()=>{if(window._talk){const t=(performance.now()-t0)/1000;orb.level(Math.max(0,.06+.05*Math.sin(t*5.1)+.04*Math.sin(t*9.7)))}},30);</script></body></html>
